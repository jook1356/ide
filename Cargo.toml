[workspace]
resolver = "3"
members = [
    "crates/ide-core",
    "crates/ide-agents",
    "crates/ide-i18n",
    "crates/ide-term",
    "crates/ide-web",
    "crates/ide-app",
    "crates/ide-proto",
    "crates/ide-server",
    "crates/ide-client",
    "crates/ide-views",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# iced master pinned (0.15-dev, wgpu 30). Move to the 0.15 release once it ships.
# Linux: X11 and Wayland (libwayland loaded at run time); ignored on Windows and macOS.
iced = { git = "https://github.com/iced-rs/iced.git", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# CEF 156 / Chromium 156. Never enable the default "sandbox" feature (needs ATL; breaks the wrapper build).
cef = { version = "=156.7.0", default-features = false }
alacritty_terminal = "0.26"
portable-pty = "0.9"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
# Client/server protocol (ide-proto, ide-server, ide-client).
tokio = { version = "1", default-features = false }
rmp-serde = "1"
bytes = "1"
futures = "0.3"
# ide-views: word-level diff of changed line pairs.
similar = "2"

ide-core = { path = "crates/ide-core" }
ide-agents = { path = "crates/ide-agents" }
ide-i18n = { path = "crates/ide-i18n" }
ide-term = { path = "crates/ide-term" }
ide-web = { path = "crates/ide-web" }
ide-proto = { path = "crates/ide-proto" }
ide-client = { path = "crates/ide-client" }
ide-views = { path = "crates/ide-views" }

[profile.release]
debug = 1
