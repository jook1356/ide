[workspace]
resolver = "3"
members = [
    "crates/meninx-core",
    "crates/meninx-agents",
    "crates/meninx-i18n",
    "crates/meninx-term",
    "crates/meninx-web",
    "crates/meninx-app",
    "crates/meninx-proto",
    "crates/meninx-server",
    "crates/meninx-client",
    "crates/meninx-views",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# iced master pinned (0.15-dev, wgpu 30). Move to the 0.15 release once it ships.
# Linux: X11 and Wayland (libwayland loaded at run time); ignored on Windows and macOS.
iced = { git = "https://github.com/iced-rs/iced.git", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# CEF 156 / Chromium 156. Never enable the default "sandbox" feature (needs ATL; breaks the wrapper build).
cef = { version = "=156.7.0", default-features = false }
alacritty_terminal = "0.26"
portable-pty = "0.9"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
# Client/server protocol (meninx-proto, meninx-server, meninx-client).
tokio = { version = "1", default-features = false }
rmp-serde = "1"
bytes = "1"
futures = "0.3"
# meninx-views: word-level diff of changed line pairs.
similar = "2"

meninx-core = { path = "crates/meninx-core" }
meninx-agents = { path = "crates/meninx-agents" }
meninx-i18n = { path = "crates/meninx-i18n" }
meninx-term = { path = "crates/meninx-term" }
meninx-web = { path = "crates/meninx-web" }
meninx-proto = { path = "crates/meninx-proto" }
meninx-client = { path = "crates/meninx-client" }
meninx-views = { path = "crates/meninx-views" }

[profile.release]
debug = 1

# The Linux servers bundled with the app for remote installs (`scripts/build-remote-servers.ps1`):
# small, no debug info.
[profile.remote]
inherits = "release"
debug = false
strip = "symbols"
