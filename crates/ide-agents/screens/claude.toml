# Claude Code screen rules (crates/ide-agents/src/screen.rs, docs/agent-bridge.md).
# The UI texts these rules look for were taken from herdr's agent detection manifests
# (github.com/herdrdev/herdr, Apache-2.0); the rules are written for this engine.
# Regions: title, whole, bottom(N), bottom_non_empty(N), top_non_empty(N), after_last_prompt,
# before_current_prompt, without_current_prompt, after_last_rule, prompt_box, above_prompt_box.
id = "claude"

# The title starts with a braille / half-circle spinner while a turn runs.
[[rules]]
id = "title_spinner"
state = "working"
priority = 1100
region = "title"
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

# Ctrl+O transcript view: says nothing about the turn.
[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty(3)"
contains = ["showing detailed transcript"]

# Permission / question forms: "Enter to confirm" or "Enter to select ... Esc to cancel".
[[rules]]
id = "dialog_form"
state = "blocked"
priority = 980
region = "after_last_rule"
contains = ["esc to cancel"]
any = [{ contains = ["enter to confirm"] }, { contains = ["enter to select"] }]

# An MCP server asks for input (Accept / Decline).
[[rules]]
id = "mcp_input"
state = "blocked"
priority = 980
region = "whole"
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server .+ requests your input\s*$']

# The turn's status line: "✻ Thinking… (12s · esc to interrupt)".
[[rules]]
id = "turn_status"
state = "working"
priority = 970
region = "bottom_non_empty(12)"
any = [
  { contains = ["esc to interrupt"] },
  { line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh]|\s*$)'] },
]

# The input box is shown and no form covers it.
[[rules]]
id = "prompt_box_idle"
state = "idle"
priority = 950
region = "prompt_box"
line_regex = ['^\s*[>❯]']
not = [{ contains = ["enter to select"] }, { contains = ["esc to cancel"] }]

# "Do you want to proceed?" with numbered Yes / No options.
[[rules]]
id = "proceed_prompt"
state = "blocked"
priority = 850
region = "whole"
contains = ["do you want to proceed?"]
any = [
  { line_regex = ['(?i)^\s*[>❯]?\s*1\.\s*yes\b'] },
  { line_regex = ['(?i)^\s*[>❯]?\s*yes\b'] },
]

# An idle title starts with ✳.
[[rules]]
id = "title_idle"
state = "idle"
priority = 250
region = "title"
regex = ['^\x{2733} ']
