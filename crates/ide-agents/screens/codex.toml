# Codex screen rules (crates/ide-agents/src/screen.rs, docs/agent-bridge.md).
# The UI texts these rules look for were taken from herdr's agent detection manifests
# (github.com/herdrdev/herdr, Apache-2.0); the rules are written for this engine.
id = "codex"

[[rules]]
id = "title_blocked"
state = "blocked"
priority = 1100
region = "title"
contains = ["Action Required"]

# The title carries a braille spinner while a turn runs.
[[rules]]
id = "title_spinner"
state = "working"
priority = 1050
region = "title"
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Transcript viewer: says nothing about the turn.
[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt"
contains = ["↑/↓ to scroll", "q to quit"]

# "Do you trust the contents of this directory?" at start.
[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty(20)"
any = [
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
  { contains = ["Trust this folder?"] },
]

# Update offer at start.
[[rules]]
id = "update_prompt"
state = "blocked"
priority = 950
region = "bottom_non_empty(20)"
contains = ["update available"]
any = [{ contains = ["update now"] }, { contains = ["enter continue"] }]

# Approvals and questions below the last prompt.
[[rules]]
id = "dialog"
state = "blocked"
priority = 900
region = "after_last_prompt"
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

# Yes / no questions while no input prompt is current.
[[rules]]
id = "yes_no"
state = "blocked"
priority = 600
region = "without_current_prompt"
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = [">"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = [">"] }] },
]

# The turn's status line: "• Working (12s • esc to interrupt)".
[[rules]]
id = "status_line"
state = "working"
priority = 500
region = "before_current_prompt"
line_regex = ['^(?:[•◦][ \t]+)?[^\s>•◦■✗✓─].* \((?:[0-9]+[hm] )*[0-9]+s(?: • .+? to interrupt)?\)(?: · .*)?$']
not = [{ line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed'] }]

# Any other title: idle.
[[rules]]
id = "title_idle"
state = "idle"
priority = 100
region = "title"
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
