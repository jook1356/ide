[package]
name = "ide-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ide"
path = "src/main.rs"

# The app is a client only: profiles, sessions, terminals, git and files live in `ide-server`,
# started as `ide-server --stdio` from next to `ide.exe`. Build both into the same target dir:
# `cargo build --release -p ide-app -p ide-server` (alias: `cargo app`).

[dependencies]
iced = { workspace = true, features = ["advanced", "svg", "tokio", "wgpu"] }
ide-client = { workspace = true, features = ["iced"] }
ide-proto.workspace = true
ide-i18n.workspace = true
ide-term.workspace = true
ide-web.workspace = true
ide-views.workspace = true
anyhow.workspace = true
futures.workspace = true
similar.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# In-app screenshots written by the IDE_APP_SCRIPT test mode.
png = "0.18"
