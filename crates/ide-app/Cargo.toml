[package]
name = "ide-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ide"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["advanced", "tokio", "wgpu"] }
ide-core.workspace = true
ide-term.workspace = true
ide-web.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Native folder picker for the new-session dialog.
rfd = "0.15"
# In-app screenshots written by the IDE_APP_SCRIPT test mode.
png = "0.18"
