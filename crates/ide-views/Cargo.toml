[package]
name = "ide-views"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Client-side iced views fed by plain view models: file tree, code view/editor, diff view, changes list."

[dependencies]
# `highlighter`: iced's syntect (two-face grammars) parser, reused for the editor and diff lines.
iced = { workspace = true, features = ["advanced", "tokio", "wgpu", "highlighter"] }
ide-i18n.workspace = true
similar.workspace = true

[dev-dependencies]
# examples/views.rs: in-app screenshots for the test script
png = "0.18"
