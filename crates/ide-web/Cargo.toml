[package]
name = "ide-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
iced = { workspace = true, features = ["advanced", "tokio", "wgpu"] }
cef = { workspace = true, features = ["accelerated_osr"] }
anyhow.workspace = true
tracing.workspace = true
# DevTools protocol messages (`cdp.rs`, `devtools.rs`).
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# MapVirtualKeyW (VK -> scan code for CEF's native_key_code) and the detail window's owner
# (owner.rs), the snap layout hit-test of the frameless windows (caption.rs), its saved place
# (placement.rs); no input injection.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18"
tracing-subscriber.workspace = true

[[example]]
name = "web"
path = "examples/web.rs"
