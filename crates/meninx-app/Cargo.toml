[package]
name = "meninx-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "meninx"
path = "src/main.rs"

# The app is a client only: profiles, sessions, terminals, git and files live in `meninx-server`,
# started as `meninx-server --stdio` from next to `meninx.exe`. Build both into the same target dir:
# `cargo build --release -p meninx-app -p meninx-server` (alias: `cargo app`).

[dependencies]
# `image`: clipboard images (screenshots pasted into the input box).
iced = { workspace = true, features = ["advanced", "svg", "tokio", "wgpu", "image"] }
meninx-client = { workspace = true, features = ["iced"] }
meninx-proto.workspace = true
meninx-i18n.workspace = true
meninx-term.workspace = true
meninx-web.workspace = true
meninx-views.workspace = true
anyhow.workspace = true
futures.workspace = true
similar.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# History: commit dates in local time (`UtcOffset::current_local_offset`).
time = { version = "0.3", features = ["local-offset"] }
# In-app screenshots written by the MENINX_APP_SCRIPT test mode.
png = "0.18"
